name: Build SkillSwap Desktop JAR

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Dependencies if Missing
        run: |
          mkdir -p lib
          [ -f lib/h2-1.4.200.jar ] || curl -L -o lib/h2-1.4.200.jar https://repo1.maven.org/maven2/com/h2database/h2/1.4.200/h2-1.4.200.jar
          [ -f lib/jbcrypt-0.4.jar ] || curl -L -o lib/jbcrypt-0.4.jar https://repo1.maven.org/maven2/org/mindrot/jbcrypt/0.4/jbcrypt-0.4.jar

      - name: Compile Java Swing Sources
        run: |
          mkdir -p bin
          javac -cp "lib/*" -d bin $(find src -name "*.java")

      - name: Check booking flow and participant views
        run: |
          javac -cp "bin:lib/*" -d "$RUNNER_TEMP" tests/BookingFlowTest.java
          xvfb-run -a java -cp "$RUNNER_TEMP:bin:lib/*" BookingFlowTest

      - name: Package Runnable JAR
        run: |
          echo "Main-Class: com.skillswap.Main" > manifest.txt
          echo "Class-Path: lib/h2-1.4.200.jar lib/jbcrypt-0.4.jar" >> manifest.txt
          jar cfm SkillSwap.jar manifest.txt -C bin .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkillSwap-Desktop
          path: |
            SkillSwap.jar
            lib/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: SkillSwap v1.0.0 - Desktop App
          body: |
            ## SkillSwap — Peer-to-Peer Student Skill Exchange

            A desktop application built with Pure Java (JDK 8+), Java Swing/AWT, H2 Embedded Database (JDBC), and BCrypt password hashing following the MVC architecture.

            ### How to Run
            1. Download `SkillSwap.jar` and the `lib/` folder
            2. Place them in the same directory
            3. Run: `java -jar SkillSwap.jar`

            > Requires Java 8 or higher installed on your system.
          files: |
            SkillSwap.jar
          token: ${{ secrets.GITHUB_TOKEN }}
